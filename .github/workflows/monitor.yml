name: Initial deployment health monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  health:
    runs-on: ubuntu-latest
    env:
      HEALTHCHECK_URL: https://jevinbox.vercel.app
      MONITOR_UNTIL: '2026-09-22T23:29:02.876445+00:00'
      MONITOR_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run monitor
