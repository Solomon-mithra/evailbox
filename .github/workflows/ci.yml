name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_MODE: demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:password@localhost:5432/jevinbox
      DIRECT_URL: postgresql://postgres:password@localhost:5432/jevinbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run env:check
      - run: npm run db:generate
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
